name: Build VCamPlus MSD (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid xz

      - name: Clone roothide Theos
        run: |
          # Clone directly instead of running install-theos: that script's Homebrew
          # dependency phase aborts on the macos-14 openssl@1.1 -> openssl@3 link
          # conflict before Theos is ever cloned. A recursive git clone pulls the
          # same tree (incl. submodules) without touching brew.
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Verify Theos cloned
        run: |
          test -d "$THEOS/vendor/include" && test -f "$THEOS/makefiles/common.mk" \
            && echo "Theos OK at $THEOS" || (echo "Theos missing"; exit 1)

      - name: Download iOS 16.5 SDK
        run: |
          mkdir -p "$THEOS/sdks"
          for i in 1 2 3 4 5; do
            curl -L --fail -o sdk.tar.xz \
              https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
              && break
            echo "SDK download attempt $i failed, retrying in 10s..."; sleep 10
          done
          tar -xf sdk.tar.xz -C "$THEOS/sdks/"

      - name: Build package (roothide scheme)
        run: |
          make package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcamplus-msd-roothide-deb
          path: packages/*.deb
          retention-days: 30
